<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>แอดมิน</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b16;--mute:#6b675c;--line:#ddd8cb;--acc:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#141310;--card:#201e1a;--ink:#f1eee6;--mute:#a29d90;--line:#37342d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans Thai",system-ui,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:0 0 8px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.k{text-align:center}.k b{display:block;font-size:22px}.k span{font-size:12px;color:var(--mute)}
input,button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--acc);color:#fff;border:0;cursor:pointer;font-weight:600}button.s{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.r{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}.r input{flex:1;min-width:90px}
.ch{display:flex;align-items:flex-end;gap:3px;height:90px}.ch div{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px}
.it{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.it:first-of-type{border-top:0}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:240px;overflow:auto;margin:6px 0 0}
.m{color:var(--mute);font-size:13px}
</style></head><body><main>
<h1>🔒 แอดมิน เช็กสัญญา</h1>
<div class="c" id="lg"><div class="r"><input id="key" type="password" placeholder="ADMIN_KEY" autocomplete="current-password"><button id="go" type="button">เข้าสู่ระบบ</button></div><p class="m" id="lm"></p></div>
<div id="app" hidden>
<div class="c"><div class="g"><div class="k"><b id="t1">0</b><span>ยอดวันนี้ (฿)</span></div><div class="k"><b id="t2">0</b><span>ออเดอร์วันนี้</span></div><div class="k"><b id="t3">0</b><span>ผู้ใช้ทั้งหมด</span></div></div>
<p class="m" style="margin:10px 0 4px">ยอดขาย 14 วันล่าสุด · รวมทั้งหมด <b id="tt">0</b> ฿</p><div class="ch" id="ch"></div></div>
<div class="c"><h2>ออเดอร์รอตรวจ</h2><div id="ord" class="m">กำลังโหลด…</div></div>
<div class="c"><h2>เพิ่ม/ลดเครดิต</h2><div class="r"><input id="uid" placeholder="รหัสผู้ใช้ (uid)"><input id="n" type="number" placeholder="จำนวน เช่น 5 หรือ -5" style="max-width:150px"><button id="ad" type="button">ยืนยัน</button></div><p class="m" id="am"></p></div>
<div class="c"><h2>รายการเติมล่าสุด</h2><div id="rec" class="m">—</div></div>
<div class="c"><h2>ข้อมูลอื่น</h2><div class="r"><button class="s" data-x="feedback" type="button">ฟีดแบ็ก</button><button class="s" data-x="lawyer" type="button">คำขอส่งต่อทนาย</button></div><pre id="raw"></pre></div>
<button class="s" id="out" type="button">ออกจากระบบ</button>
</div></main>
<script>
const $=i=>document.getElementById(i),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let K="";try{K=sessionStorage.getItem("ak")||""}catch(e){}
const A=async(p,q)=>{const r=await fetch(p+(q?"?"+new URLSearchParams(q):""),{headers:{"x-admin-key":K}});const d=await r.json().catch(()=>({}));if(r.status===403){K="";try{sessionStorage.removeItem("ak")}catch(e){}$("app").hidden=true;$("lg").hidden=false;throw new Error("forbidden")}return d};
async function load(){
const s=await A("/admin/stats");$("lg").hidden=true;$("app").hidden=false;
$("t1").textContent=s.today.baht;$("t2").textContent=s.today.n;$("t3").textContent=s.users;$("tt").textContent=s.total;
const mx=Math.max(1,...s.days.map(d=>d.baht));$("ch").innerHTML=s.days.map(d=>`<div title="${d.d}: ${d.baht}฿" style="height:${Math.round(d.baht/mx*100)}%"></div>`).join("");
$("rec").innerHTML=s.recent.length?s.recent.map(r=>`<div class="it"><span>${new Date(r.ts).toLocaleString("th-TH")} · ${E(r.uid)}</span><b>${r.baht?r.baht+"฿ ":""}(${r.days?"รายเดือน "+r.days+" วัน":"+"+r.credits})</b></div>`).join(""):"ยังไม่มีรายการ";
const o=(await A("/admin/orders")).orders||[];
$("ord").innerHTML=o.length?o.map(x=>`<div class="it"><span>${E(x.ref)} · ${E(x.uid)}<br>${x.baht}฿ → ${x.days?"แพ็กเกจ "+x.days+" วัน":x.credits+" เครดิต"} · ${E(x.method)}</span><button data-ap="${E(x.ref)}" type="button">อนุมัติ</button></div>`).join(""):"ไม่มีออเดอร์ค้าง"}
async function login(){K=$("key").value.trim();if(!K)return;$("lm").textContent="";try{await load();sessionStorage.setItem("ak",K)}catch(e){$("lm").textContent="รหัสไม่ถูกต้อง หรือเชื่อมต่อไม่ได้"}}
$("go").onclick=login;$("key").onkeydown=e=>{if(e.key==="Enter")login()};
$("out").onclick=()=>{K="";try{sessionStorage.removeItem("ak")}catch(e){}location.reload()};
$("ad").onclick=async()=>{const n=+$("n").value,u=$("uid").value.trim();if(!u||!n)return;if(!confirm(`ปรับเครดิต ${u} ${n>0?"+":""}${n} ?`))return;
const d=await A("/admin/credit",{uid:u,n});$("am").textContent=d.credits!=null?"สำเร็จ ตอนนี้เหลือ "+d.credits+" เครดิต":"ไม่สำเร็จ ("+(d.error||"")+")";load()};
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.ap){if(!confirm("ยืนยันว่าได้รับเงินแล้ว และเพิ่มเครดิตให้ผู้ใช้?"))return;const d=await A("/admin/approve",{ref:b.dataset.ap});if(!d.ok)alert("ไม่สำเร็จ: "+(d.error||""));load()}
else if(b.dataset.x){const r=await fetch("/admin/"+b.dataset.x+"?key="+encodeURIComponent(K));$("raw").textContent=(await r.text()).slice(0,20000)}});
if(K)load().catch(()=>{});
</script></body></html>
