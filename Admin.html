<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Checker - Admin Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        #adminResult {
            margin-top: 20px;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Admin Dashboard</h2>
        <div class="form-group">
            <label for="adminKey">Admin Key (รหัสผ่านแอดมิน):</label>
            <input type="password" id="adminKey" placeholder="กรอกรหัสแอดมิน...">
        </div>
        <button onclick="loadAdminData()">เข้าสู่ระบบ / โหลดข้อมูล</button>
        <div id="adminResult"></div>
    </div>

    <script>
        async function loadAdminData() {
            const key = document.getElementById('adminKey').value;
            const resultDiv = document.getElementById('adminResult');

            if (!key.trim()) {
                alert('กรุณากรอก Admin Key');
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerText = 'กำลังโหลดข้อมูล...';

            try {
                const response = await fetch(`/admin?key=${encodeURIComponent(key)}`);
                const data = await response.json();
                resultDiv.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อ หรือรหัสผ่านไม่ถูกต้อง';
            }
        }
    </script>
</body>
</html>
