<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Checker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        textarea, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea:focus, input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Contract Checker</h2>
        <div class="form-group">
            <label for="contractText">วางโค้ดสัญญาหรือข้อมูลที่ต้องการตรวจสอบ:</label>
            <textarea id="contractText" rows="6" placeholder="กรอกข้อมูลสัญญาที่นี่..."></textarea>
        </div>
        <button onclick="checkContract()">ตรวจสอบสัญญา</button>
        <div id="result"></div>
    </div>

    <script>
        async function checkContract() {
            const text = document.getElementById('contractText').value;
            const resultDiv = document.getElementById('result');
            
            if (!text.trim()) {
                alert('กรุณากรอกข้อมูลสัญญาก่อนตรวจสอบ');
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerText = 'กำลังตรวจสอบ...';

            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ contract: text })
                });
                
                const data = await response.json();
                resultDiv.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์';
            }
        }
    </script>
</body>
</html>
